name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          python -m pip check
      - name: Run tests
        run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install maintained benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'torch>=2.15.0' --index-url https://download.pytorch.org/whl/cpu
          pip install -r benchmarks/requirements-repro.txt
          python -m pip check
      - name: Audit installed benchmark dependencies
        run: |
          pip install pip-audit
          pip-audit
      - name: Run synthetic benchmark
        env:
          OMP_NUM_THREADS: "2"
        run: python benchmarks/run_benchmark.py --config benchmarks/configs/smoke_hakuli.json --output /tmp/smoke_hakuli.json

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Verify artifacts
        run: |
          python - <<'EOF'
          import glob
          import tarfile
          import zipfile

          sdist = glob.glob("dist/*.tar.gz")[0]
          wheel = glob.glob("dist/*.whl")[0]

          with tarfile.open(sdist) as tar:
              names = tar.getnames()
          for required in ("LICENSE", "NOTICE", "README.md", "pyproject.toml"):
              assert any(n.endswith(required) for n in names), f"sdist missing {required}"

          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
          for required in ("hakuli/__init__.py", "hakuli/optim.py"):
              assert required in names, f"wheel missing {required}"

          print("sdist OK:", sdist)
          print("wheel OK:", wheel)
          EOF
      - name: Install wheel and import
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install dist/*.whl
          python -c "import hakuli; from hakuli import Hakuli; print('hakuli', hakuli.__version__, 'OK')"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
