version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Root scanning otherwise also updates nested frozen benchmark manifests.
    exclude-paths:
      - "benchmarks/**"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/benchmarks"
    exclude-paths:
      - "requirements-repro.txt"
    schedule:
      interval: "weekly"
    groups:
      benchmark-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
